name: Security & Quality CI

on:
  push:
    branches: [main, master, security-and-responsive]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: NPM Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

  test-and-lint:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    needs: security-audit
    env:
      NEXTAUTH_SECRET: ci_test_secret_32_characters_minimum_len!
      MONGODB_URI: mongodb://localhost:27017/test_db
      CLOUDINARY_CLOUD_NAME: ci_cloud
      CLOUDINARY_API_KEY: ci_key
      CLOUDINARY_API_SECRET: ci_secret
      GOOGLE_AI_API_KEY: ci_gemini_key
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Next.js Linter
        run: npm run lint

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Jest Test Suite
        run: npm test -- --ci --maxWorkers=2
